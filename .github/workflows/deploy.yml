name: Deploy to GitHub Pages (main + dev)

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Set base & destination
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "VITE_BASE=/arch_site/" >> $GITHUB_ENV
            echo "DEST_DIR=." >> $GITHUB_ENV
          else
            echo "VITE_BASE=/arch_site/dev/" >> $GITHUB_ENV
            echo "DEST_DIR=dev" >> $GITHUB_ENV
          fi

      - name: Build
        env:
          VITE_BASE: ${{ env.VITE_BASE }}
          VITE_YMAPS_KEY: ${{ secrets.VITE_YMAPS_KEY }}
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist
          destination_dir: ${{ env.DEST_DIR }}
          keep_files: true
