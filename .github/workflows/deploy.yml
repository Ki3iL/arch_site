name: Deploy to GitHub Pages (main)

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_BASE: /
          VITE_YMAPS_KEY: ${{ secrets.VITE_YMAPS_KEY }}
        run: npm run build

      - name: Add CNAME
        run: echo "arhtehproekt.ru" > dist/CNAME

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist

